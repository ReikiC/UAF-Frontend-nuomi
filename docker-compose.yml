version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uaf-frontend
    ports:
      - "1145:80"  # 映射到主机 1145 端口
    environment:
      # 留空，让前端使用相对路径 /api，通过 Nginx 代理访问后端
      - VITE_API_URL=
    restart: unless-stopped
    networks:
      - uaf-network

networks:
  uaf-network:
    external: true
    name: uaf-network
