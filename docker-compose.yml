version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uaf-frontend
    ports:
      - "1145:80"  # 映射到主机 1145 端口
    environment:
      # 使用容器服务名连接后端，而非 localhost
      - VITE_API_URL=http://app:8000
    restart: unless-stopped
    networks:
      - uaf-network

networks:
  uaf-network:
    external: true
    name: uaf-network
